name: Build and Push RunPod Worker

on:
  push:
    branches:
      - main 
    # OPTIMIZATION 1: Path Filtering
    # Only trigger this heavy build if actual container files change.
    # Editing a README or JSON file won't waste your build minutes.
    paths:
      - 'Dockerfile'
      - 'handler.py'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest 

    steps:
      # OPTIMIZATION 2: Free Disk Space
      # GitHub standard runners only have ~14GB of free space. 
      # Building a 15GB AI image usually crashes with "No space left on device".
      # This step deletes pre-installed Android/.NET libraries to give Docker ~30GB of room.
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Faster network driver for pulling huge model weights
          driver-opts: network=host 

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Disable provenance generation (can cause issues with some container registries)
          provenance: false 
          # OPTIMIZATION 3: Multi-Tagging
          # Tags both as 'v3' (for RunPod) and 'latest' (standard practice)
          tags: |
            sahihislam/sahihislam-worker:v3
            sahihislam/sahihislam-worker:latest
          # Your existing layer caching (Perfect as-is)
          cache-from: type=gha
          cache-to: type=gha,mode=max