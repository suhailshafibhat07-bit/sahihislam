name: Build and Push RunPod Worker

# This tells GitHub to run this script every time you push to the 'main' branch
on:
  push:
    branches:
      - main 

jobs:
  build-and-push:
    # GitHub will spin up its own temporary Linux server to do the work!
    runs-on: ubuntu-latest 

    steps:
      # 1. Grab your code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Log into Docker Hub securely
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Set up the Docker engine on GitHub's server
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build and Push the 15GB image directly to Docker Hub!
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Make sure to replace 'your_username' below!
          tags: sahihislam/sahihislam-worker:v3